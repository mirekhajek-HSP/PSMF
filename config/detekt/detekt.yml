# Overrides on top of detekt's default rule set (buildUponDefaultConfig).
# Only deviations live here; everything else is detekt's default.

build:
  maxIssues: 0

complexity:
  LongParameterList:
    # Domain constructors from the ZoU field spec are genuinely wide: the
    # match header alone carries pitch, date, time, group, referee,
    # assistant, hire flag and delegating team. See analysis section 2.5.
    functionThreshold: 8
    constructorThreshold: 12
  TooManyFunctions:
    thresholdInInterfaces: 15

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 120
  ForbiddenComment:
    # A bare TODO must not silently become permanent, but the default also
    # trips on the word appearing in prose. Keep it to the marker form.
    comments:
      - reason: 'Unresolved TODO. Either finish it or raise it in docs/.'
        value: 'TODO:'

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']

# No `formatting:` section: the detekt-formatting ruleset is not on the
# classpath. ktlint runs as its own task instead, so the two tools cannot
# report the same finding twice. Adding a section for a ruleset detekt
# cannot see fails the run with "Property is misspelled or does not exist".

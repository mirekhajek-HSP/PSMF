# Overrides on top of detekt's default rule set (buildUponDefaultConfig).
# Only deviations live here; everything else is detekt's default.

build:
  maxIssues: 0

complexity:
  LongMethod:
    # The ZoU header is genuinely wide -- page 1 alone carries pitch, date,
    # time, group, two officials, a hire flag, the delegating team, both
    # results and eight assessment ratings. Writing that row is one long
    # statement, not tangled logic. Same reason as LongParameterList below.
    threshold: 80
  TooManyFunctions:
    # A mapping file is many small functions by nature, and small is the
    # point. The in-class threshold is left at its default.
    thresholdInFiles: 25
    thresholdInInterfaces: 15
    # The ZoU has nine blocks and each formatter writes one small function
    # per block. Folding them together to satisfy a count would produce one
    # long method and a worse file.
    thresholdInObjects: 20
  LongParameterList:
    # Domain constructors from the ZoU field spec are genuinely wide: the
    # match header alone carries pitch, date, time, group, referee,
    # assistant, hire flag and delegating team. See analysis section 2.5.
    functionThreshold: 8
    constructorThreshold: 12

style:
  ReturnCount:
    # Guard clauses. Parsing and validation read better as a sequence of
    # early returns than as nested conditionals, and the default of 2 is
    # low for that style. Raised deliberately, not baselined.
    max: 4
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 120
  ForbiddenComment:
    # A bare TODO must not silently become permanent, but the default also
    # trips on the word appearing in prose. Keep it to the marker form.
    comments:
      - reason: 'Unresolved TODO. Either finish it or raise it in docs/.'
        value: 'TODO:'

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']

# No `formatting:` section: the detekt-formatting ruleset is not on the
# classpath. ktlint runs as its own task instead, so the two tools cannot
# report the same finding twice. Adding a section for a ruleset detekt
# cannot see fails the run with "Property is misspelled or does not exist".

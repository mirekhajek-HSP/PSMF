# Container-side local.properties, bind-mounted over the repo's own copy by
# compose.yaml.
#
# It is intentionally EMPTY of settings. AGP resolves the SDK in this order:
#
#     sdk.dir (this file)  >  ANDROID_HOME  >  ANDROID_SDK_ROOT
#
# By declaring no sdk.dir, resolution falls through to ANDROID_HOME, which the
# image sets to /opt/android-sdk. That keeps the SDK path in exactly one place
# (the Dockerfile) instead of duplicating it here.
#
# The host's real local.properties still holds the Windows path
# (C:\Users\...\Android\Sdk) for Android Studio. The two never see each other.
#
# This file MUST stay tracked in git and MUST NOT be deleted. Docker creates
# a missing bind-mount source as a root-owned directory, which turns a
# missing file into a mount that AGP cannot read.

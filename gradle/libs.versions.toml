# Single source of truth for every dependency and plugin version.
#
# RULE: no hardcoded coordinates in any build file, ever. golblok's catalog
# was half-used and its versions drifted apart as a result.
#
# SEVERAL VERSIONS BELOW ARE DELIBERATELY NOT THE LATEST. They are pinned
# by a chain of compatibility constraints that took a bisection to find.
# Read docs/BUILD_MATRIX.md before bumping any of kotlin, agp, gradle,
# composeMultiplatform or lifecycle -- they move together or not at all.

[versions]
# --- toolchain ---------------------------------------------------------
kotlin = "2.4.10"

agp = "9.3.2"

# Gradle is set in gradle/wrapper/gradle-wrapper.properties to 9.7.1.
# AGP 9 requires 9.1.0 or newer.
jvmToolchain = "17"

# --- android -----------------------------------------------------------
# minSdk 28 (Android 9). Chosen by the project owner, who uses 28 for
# other apps. TECH_STACK.md section 5 listed this as open pending device
# data; 28 is a decision, not a guess, and can still be lowered if the
# referee population turns out to skew older than expected.
androidMinSdk = "28"
androidTargetSdk = "37"
androidCompileSdk = "37"
# Must match what the container image installs, or sdkmanager silently
# downloads a different build-tools package on every container run.
# The Dockerfile installs platforms;android-37.0 and build-tools;37.0.0.
androidBuildTools = "37.0.0"

# --- compose -----------------------------------------------------------
# Requires compileSdk 37 and AGP 9.1+, both of which are now satisfied.
composeMultiplatform = "1.12.0"
androidxActivityCompose = "1.13.0"
# Resolved transitively at this version already; pinned so it is visible.
androidxCore = "1.18.0"
# Stable and effectively unchanged for years -- a thin, well-tested
# wrapper over SAF tree operations (find-or-create a document by name).
androidxDocumentfile = "1.0.1"

# --- kotlinx -----------------------------------------------------------
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"

# --- libraries ---------------------------------------------------------
# The JetBrains org.jetbrains.androidx.lifecycle port is used rather than
# androidx.lifecycle: it is the one built to sit under Compose Multiplatform.
lifecycle = "2.11.0"
koin = "4.2.2"
sqldelight = "2.3.2"
# Ktor is versioned here but deliberately not applied to any module yet.
# See docs/TECH_STACK.md section 6: no backend exists and the demo makes no
# network call, so wiring it into a module would be aspiration, not fact.
ktor = "3.5.2"

# --- testing -----------------------------------------------------------
turbine = "1.2.1"

# --- quality -----------------------------------------------------------
detekt = "1.23.8"
ktlint = "1.8.0"
ktlintGradle = "14.2.0"

[libraries]
# kotlinx
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

# lifecycle / viewmodel (multiplatform)
lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# di
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

# persistence
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-driver-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-driver-native = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-driver-jvm = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }

# http -- catalogued, not yet applied to any module
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# compose -- BackHandler is NOT part of compose.ui and has no `compose.`
# DSL accessor, so it is catalogued like any other coordinate. Versioned
# with Compose Multiplatform, which is what publishes it.
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }

# FileProvider, for handing the exported files to a mail client without
# writing anything the user has to clean up or asking for a permission.
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
# For AndroidReportSaver: find-or-create a file inside the folder tree
# ACTION_OPEN_DOCUMENT_TREE hands back, without hand-rolling
# DocumentsContract queries.
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "androidxDocumentfile" }

# android ui
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }

# testing
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# quality -- referenced by the detekt plugin block, not by a module
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
# The AGP 9 plugin for multiplatform modules. It replaces com.android.library,
# which since AGP 9.0 refuses to apply alongside the KMP plugin.
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }

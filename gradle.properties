org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is deliberately OFF for now: detekt 1.23.x is not
# fully configuration-cache compatible. Revisit when detekt 2 lands.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# iOS targets are declared but cannot be built on Linux. This stops the
# Linux build failing on them instead of skipping them.
kotlin.native.ignoreDisabledTargets=true
